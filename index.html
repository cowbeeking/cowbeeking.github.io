<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我们的爱 - 永恒纪念</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;700&display=swap" rel="stylesheet">

    <style>
        /* ==================== 全局重置 ==================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            /* 背景：深邃浪漫的星空紫渐变 */
            background: linear-gradient(to bottom, #0f0c29, #302b63, #24243e);
            font-family: 'Noto Serif SC', serif;
            color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* ==================== 背景粒子 Canvas ==================== */
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none; /* 让鼠标事件穿透画布 */
        }

        /* ==================== 主容器 (毛玻璃卡片) ==================== */
        .container {
            position: relative;
            z-index: 1;
            /* 极其细腻的毛玻璃质感 */
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 2.5rem 3rem;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            text-align: center;
            animation: cardFloat 1s ease-out;
            max-width: 90%;
            width: 550px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ==================== 顶部嵌入图片样式 ==================== */
        .banner-image {
            width: 100%;
            height: 220px;
            object-fit: cover; /* 保证图片裁剪不变形 */
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255,255,255,0.1);
            transition: transform 0.5s ease;
        }

        .banner-image:hover {
            transform: scale(1.02); /* 鼠标悬停轻微放大 */
        }

        /* ==================== 标题区域 ==================== */
        .header h1 {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 3.2rem;
            margin-bottom: 8px;
            background: linear-gradient(to right, #ff9a9e, #fad0c4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 10px rgba(255, 154, 158, 0.3);
        }

        .header p {
            font-size: 1rem;
            letter-spacing: 3px;
            color: rgba(255, 255, 255, 0.75);
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 15px;
            display: inline-block;
        }

        /* ==================== 计时器区域 ==================== */
        .timer-box {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 25px;
            width: 100%;
        }

        .time-item {
            background: rgba(0, 0, 0, 0.25);
            padding: 10px 12px;
            border-radius: 10px;
            min-width: 75px;
            border: 1px solid rgba(255,255,255,0.05);
            backdrop-filter: blur(5px);
        }

        .time-val {
            display: block;
            font-size: 1.8rem;
            font-weight: 700;
            color: #fff;
            line-height: 1.2;
        }

        .time-label {
            font-size: 0.8rem;
            color: #d1d1d1;
            font-weight: 300;
        }

        /* ==================== 底部情话 (打字机) ==================== */
        .footer-msg {
            font-size: 1.1rem;
            min-height: 3em;
            color: #e0c3fc;
            line-height: 1.6;
            font-weight: 300;
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
        }

        /* ==================== 动画定义 ==================== */
        @keyframes cardFloat {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ==================== 移动端适配 ==================== */
        @media (max-width: 600px) {
            .container { padding: 1.5rem; width: 95%; }
            .header h1 { font-size: 2.5rem; }
            .banner-image { height: 180px; }
            .time-val { font-size: 1.4rem; }
            .time-item { min-width: 60px; padding: 8px; }
        }
    </style>
</head>

        /** 1. 倒计时逻辑 **/
        function updateTimer() {
            const start = new Date(CONFIG.startDate);
            const now = new Date();
            const diff = now - start;

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / (1000 * 60)) % 60);
            const seconds = Math.floor((diff / 1000) % 60);

            // 补零函数
            const pad = (n) => n < 10 ? '0' + n : n;

            const html = `
                <div class="time-item"><span class="time-val">${days}</span><span class="time-label">天</span></div>
                <div class="time-item"><span class="time-val">${pad(hours)}</span><span class="time-label">时</span></div>
                <div class="time-item"><span class="time-val">${pad(minutes)}</span><span class="time-label">分</span></div>
                <div class="time-item"><span class="time-val">${pad(seconds)}</span><span class="time-label">秒</span></div>
            `;
            document.getElementById('timer').innerHTML = html;
        }
        setInterval(updateTimer, 1000);
        updateTimer();

        /** 2. 打字机特效 **/
        let msgIdx = 0;
        let charIdx = 0;
        let isDeleting = false;
        const typeEl = document.getElementById('typewriter');

        function type() {
            const currentText = CONFIG.messages[msgIdx];

            if (isDeleting) {
                typeEl.textContent = currentText.substring(0, charIdx - 1);
                charIdx--;
            } else {
                typeEl.textContent = currentText.substring(0, charIdx + 1);
                charIdx++;
            }

            let speed = isDeleting ? 80 : 150; // 删除速度 vs 打字速度

            if (!isDeleting && charIdx === currentText.length) {
                speed = 2500; // 打完后停留时间
                isDeleting = true;
            } else if (isDeleting && charIdx === 0) {
                isDeleting = false;
                msgIdx = (msgIdx + 1) % CONFIG.messages.length;
                speed = 500;
            }

            setTimeout(type, speed);
        }
        type();

                this.speed = Math.random() * 0.7 + 0.3; // 上浮速度
                this.color = CONFIG.particleColors[Math.floor(Math.random() * CONFIG.particleColors.length)];
                this.opacity = Math.random() * 0.5 + 0.2;
                this.swing = Math.random() * 1.5; // 左右摇摆幅度
                this.swingStep = Math.random() * 0.02;
                this.angle = Math.random() * Math.PI * 2;
            }

            update() {
                this.y -= this.speed;
                this.angle += this.swingStep;
                this.x += Math.cos(this.angle) * this.swing;
                if (this.y < -50) this.reset();
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = this.color;
                ctx.translate(this.x, this.y);

                // 绘制心形
                ctx.beginPath();
                const s = this.size;
                ctx.moveTo(0, -s/2);
                ctx.bezierCurveTo(-s/2, -s/2 - s/3, -s, -s/3, -s, 0);
                ctx.bezierCurveTo(-s, s/2, 0, s, 0, s);
                ctx.bezierCurveTo(0, s, s, s/2, s, 0);
                ctx.bezierCurveTo(s, -s/3, s/2, -s/2 - s/3, 0, -s/2);
                ctx.fill();
                ctx.restore();
            }
        }

        function initParticles() {
            particles = [];
            const count = window.innerWidth < 768 ? 50 : 100; // 移动端减少粒子
            for(let i=0; i<count; i++) particles.push(new Heart());
        }

        function animate() {
            ctx.clearRect(0, 0, w, h);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }

        initParticles();
        animate();
    </script>
</body>
</html>
